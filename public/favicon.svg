<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Modern Orbital Ring -->
  <ellipse cx="32" cy="34" rx="22" ry="7" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.8" transform="rotate(-15 32 34)"/>

  <!-- Graduation Cap -->
  <path d="M32 14L14 23L32 32L50 23L32 14Z" fill="url(#capGrad)"/>
  
  <!-- Cap Skull Base -->
  <path d="M20 27.5V36C20 40 25 43 32 43C39 43 44 40 44 36V27.5L32 33.5L20 27.5Z" fill="#EEF2FF" opacity="0.95"/>
  
  <!-- Cap Tassel -->
  <path d="M46 25V38C46 39.5 44.5 40 44.5 40" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44.5" cy="40" r="2" fill="#F59E0B"/>
  
  <!-- Smart Pulse Core -->
  <circle cx="32" cy="23" r="2.5" fill="#38BDF8"/>
</svg>
